name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same hooks as a local commit (ruff, nbstripout, file hygiene). The pytest
      # hook is pre-push only, so it does not run here — the test job covers it.
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # CPU-only torch: the default wheel pulls several GB of CUDA libraries that
        # the test suite never uses. `--group` needs pip >= 25.1.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --group dev
      - name: Test
        run: python -m pytest -m "not notebooks"

  notebooks:
    # Executes every example notebook with capped budgets (see
    # tests/test_notebooks.py): checks they still run, not their results.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[examples]" --group dev
      - name: Run notebooks
        run: python -m pytest -m notebooks --durations=0
