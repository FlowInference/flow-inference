# Rendered example notebooks, published to GitHub Pages.
# Build the pages first with `python scripts/build_docs.py` (see that script).
site_name: flow_inference
site_description: Guided flow-based sampling of stochastic processes under user-specified conditions
site_url: https://flowinference.github.io/flow-inference/
repo_url: https://github.com/FlowInference/flow-inference
repo_name: FlowInference/flow-inference
edit_uri: ""

# Generated by scripts/build_docs.py; both live under the gitignored build/.
docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  font: false  # Helvetica, as on henrymoss.github.io (see assets/extra.css)
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false        # scripts/build_docs.py has already run them
      include_source: true  # "download notebook" button on each page

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
